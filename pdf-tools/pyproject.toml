[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-tools"
version = "0.1.0"
authors = [
  { name="python-skills" }
]
description = "当用户需要对本地 PDF 进行元数据查看、页面拆分/合并/旋转或文本/图片提取时使用本技能"
requires-python = ">=3.10"
dependencies = [
    "PyMuPDF>=1.23.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["pdf_tools*"]

[project.urls]
"Homepage" = "https://github.com/cairy/python-skills/tree/main/pdf-tools"
