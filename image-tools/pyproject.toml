[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "image-tools"
version = "0.1.0"
authors = [
  { name="python-skills" }
]
description = "当用户需要对本地图片进行标准化预处理（EXIF 校正、等比缩放、格式转换、JPEG 压缩、批量处理、调试画框）时使用本技能"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["image_tools*"]

[project.urls]
"Homepage" = "https://github.com/cairy/python-skills/tree/main/image-tools"
